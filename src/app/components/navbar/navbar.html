<nav class="navbar" role="navigation" aria-label="Navegación principal">
  <div class="navbar-inner">
    <button class="btn-icon icon-only sidebar-toggle" type="button" aria-label="Abrir menú" (click)="toggleSidebar.emit()">
      <ng-icon name="phosphorList" size="24" strokeWidth="2" />
    </button>

    <a class="navbar-brand" routerLink="/" aria-label="Fuentes Miami - Inicio">
      <ng-icon name="phosphorTreePalm" class="brand-icon" size="28" strokeWidth="2" />
      <span class="brand-text">Fuentes Miami</span>
    </a>

    <ul class="navbar-nav">
      <li class="nav-item">
        <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/article/introduccion" routerLinkActive="active">Introducción</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/article/historia" routerLinkActive="active">Historia</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/article/conceptos-fundamentales" routerLinkActive="active">Conceptos</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/article/arquitectura" routerLinkActive="active">Arquitectura</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/article/ejemplos-practicos" routerLinkActive="active">Ejemplos</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/article/referencias" routerLinkActive="active">Referencias</a>
      </li>
    </ul>

    <div class="navbar-actions">
      <button class="btn-icon icon-only" type="button" aria-label="Buscar">
        <ng-icon name="phosphorMagnifyingGlass" size="20" strokeWidth="2" />
      </button>
      <button class="btn-icon" type="button" [attr.aria-label]="'Cambiar a tema ' + (resolvedTheme() === 'dark' ? 'claro' : 'oscuro')" (click)="toggleTheme()" [attr.aria-pressed]="resolvedTheme() === 'dark'">
        <ng-icon [name]="getThemeIcon()" size="20" strokeWidth="2" />
        <span class="theme-label">{{ getThemeLabel() }}</span>
      </button>
    </div>
  </div>
</nav>
