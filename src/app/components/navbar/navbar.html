<header class="navbar">
  <div class="navbar__identity">
    <button class="navbar__menu" type="button" aria-label="Abrir menú">
      <ng-icon [svg]="menuIcon" size="1.5rem" aria-hidden="true" />
    </button>
    <a class="navbar__brand" href="/" aria-label="Fuentes Miami, inicio">
      <img class="navbar__brand-icon" src="assets/img/palmera.png" alt="" />
      <span>Fuentes Miami</span>
    </a>
  </div>

  @if (showSearch) {
    <form class="navbar__search" role="search" (submit)="$event.preventDefault()">
      <div class="navbar__search-field">
        <ng-icon class="navbar__search-icon" [svg]="searchIcon" size="1.15rem" aria-hidden="true" />
        
        <input
          class="navbar__search-input"
          type="search"
          name="q"
          placeholder="Buscar..."
          aria-label="Buscar"
        />
      </div>
    </form>
  }

  <div class="navbar__actions">
    <button class="navbar__account" type="button" routerLink="/registro">Crear cuenta</button>
    <button class="navbar__account" type="button" routerLink="/iniciar-sesion">Iniciar sesión</button>
    @if (showBackToHome) {
      <button
        class="navbar__back"
        type="button"
        routerLink=""
        aria-label="Volver a portada"
        title="Volver a portada"
      >
        <ng-icon [svg]="backIcon" size="1.25rem" aria-hidden="true" />
      </button>
    }
  </div>
</header>
